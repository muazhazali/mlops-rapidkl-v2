name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra model --extra api --extra dev

      - name: Lint
        run: uv run ruff check src/ api/ tests/

      - name: Train model
        run: uv run python -c "from rapidkl.train import train_model; train_model(params={'n_estimators': 10, 'max_depth': 3, 'learning_rate': 0.1, 'n_jobs': 1})"

      - name: Test
        run: uv run pytest tests/ -q